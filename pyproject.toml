[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nas4textgen"
version = "0.1.0.dev0"
description = "A multi-objective neural architecture search benchmark for text generation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"

# ─────────────────────────────────────────────────────────────────────────────
# BASE = the `verify` replication tier.
#
# CPU only. No CUDA, no platform-specific wheels. This set must install on
# macOS and on CPU-only Linux, because the verification tier exists for readers
# who have no GPU: it re-derives the enumeration, the cost front, the sampling
# designs, the surrogate study and every statistical comparison from the
# published benchmark table.
#
# Adding a GPU dependency here breaks that promise. See design.md D16.
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  # ── Algorithm slate (design.md D20) ──
  # The evolutionary and decomposition algorithms compared against the exact front.
  # `Choice` variables handle the categorical genes natively, which is a better fit
  # than mapping to [0,1] and repairing — the route that let a fractional embedding
  # dimension into the prior work's objective. CPU only; belongs in the base group
  # because the verify tier must re-derive the algorithm comparison.
  "pymoo>=0.6.1",

  # ── Surrogate slate (design.md D17) — all CPU builds ──
  # scikit-learn covers: Random Forest, SVR, MLP, Gaussian Process,
  # Bayesian ridge, and the linear trivial baseline.
  "scikit-learn>=1.4",
  # Gradient boosting family. CatBoost handles the categorical genes natively
  # instead of one-hot expanding them; LightGBM is often strongest at this
  # sample size; XGBoost also provides the pairwise ranking objective, which is
  # the only candidate trained on the criterion we select by.
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "catboost>=1.2",
  # Uncertainty-aware candidates, for calibration reporting and for choosing
  # what to measure next in the wave loop.
  "ngboost>=0.5",
  "quantile-forest>=1.3",
  # statistics: Friedman post-hoc, and the Bayesian models of design.md D11
  "scikit-posthocs>=0.9",
  "pymc>=5.10",
  "arviz>=0.17",
]

[project.optional-dependencies]

# TRAIN = the `smoke`, `partial` and `full` tiers.
# Pulls a CUDA build of PyTorch on Linux. Locked separately, per platform.
train = [
  "torch>=2.4",
  "transformers>=4.44",
  "tokenizers>=0.19",
  "datasets>=2.20",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "evaluate>=0.4",
  "nltk>=3.9",
  "mauve-text>=0.4",
]

# AZURE = job submission and telemetry against the provisioned workspace.
azure = [
  "azure-ai-ml>=1.19",
  "azure-identity>=1.17",
  "azure-storage-blob>=12.20",
]

# DEV = contributors and CI.
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
]

[project.urls]
Repository = "https://github.com/vsosahdz/NAS4TextGenerationApproach"

[tool.hatch.build.targets.wheel]
packages = ["src/nas4textgen"]

# ─────────────────────────────────────────────────────────────────────────────
# PyTorch index, declared HERE and not in prose.
#
# specs/replication-package/spec.md requires that "the package index required to
# resolve it is declared in project configuration rather than in prose
# instructions". If a reader has to remember to pass --extra-index-url, then
# "resolves from the lockfile alone" fails on first contact with a stranger.
#
# CUDA 12.1 chosen for broad driver compatibility; the T4 is sm_75 and is
# supported by cu118/cu121/cu124. This pin MUST be validated against the driver
# version in the Azure VM image during task 6.3 before the sweep runs.
#
# The marker keeps macOS and CPU-only Linux resolving torch from PyPI, so the
# `train` extra remains installable for local development without CUDA.
# ─────────────────────────────────────────────────────────────────────────────
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "gpu: requires a CUDA device; excluded from the verify tier",
  "slow: takes more than a few seconds",
  "gate: structural gate checks over the enumerated space",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
